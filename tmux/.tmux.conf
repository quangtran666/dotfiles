# Đổi prefix key từ Ctrl+b sang Ctrl+a cho dễ bấm
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Hỗ trợ chuột
set -g mouse on

# Giao diện
set -g base-index 1
setw -g pane-base-index 1
set -g status-position bottom

# Tự động đổi tên window
setw -g automatic-rename on
set -g renumber-windows on

# Cải thiện hỗ trợ màu sắc cho theme
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Di chuyển giữa panes bằng Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Tạo window/pane mới ở cùng thư mục hiện tại
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_status_style "basic"
# Force basic separators cho current window (override giá trị cũ)
set -g @catppuccin_window_current_left_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator " "
# Hiển thị tên chương trình (#W) cho cả window active và inactive
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Status bar (SAU khi load catppuccin)
set -g window-status-separator ""
set -g status-right-length 100
set -g status-left ""
set -g status-right "#[bg=#1e66f5,fg=#eff1f5] QUANG "
set -ag status-right "#[bg=#df8e1d,fg=#eff1f5] CPU #{cpu_percentage} "
set -ag status-right "#[bg=#40a02b,fg=#eff1f5] MEM #{ram_percentage} "

# Plugins (SAU status config)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'aserowy/tmux.nvim'

# resize
set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'

# keybindings cho search
bind-key / copy-mode \; send-key ? # Prefix + /: search text trong history của pane hiện tại

# Setup cho copy
bind-key v copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Chạy TPM cuối cùng
run '~/.tmux/plugins/tpm/tpm'
